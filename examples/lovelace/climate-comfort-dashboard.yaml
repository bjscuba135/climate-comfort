title: Climate Comfort
path: climate-comfort
icon: mdi:home-thermometer
cards:
  - type: custom:climate-comfort-card
    entity: climate.conservatory
    aggressiveness_entity: select.conservatory_aggressiveness
    triggers:
      - entity: binary_sensor.conservatory_aircon_heat_10_degc
        kind: heating
        label: Aircon heat
      - entity: binary_sensor.conservatory_radiator_5_degc
        kind: heating
        label: Radiator
      - entity: binary_sensor.conservatory_aircon_fan_0_degc
        kind: cooling
        label: Aircon fan
      - entity: binary_sensor.conservatory_aircon_cool_3_degc
        kind: cooling
        label: Aircon cool
      - entity: binary_sensor.conservatory_fan_10_degc
        kind: cooling
        label: Extractor fan
      - entity: binary_sensor.conservatory_aircon_dry_65
        kind: humidity
        label: Dry mode

  - type: entities
    title: House Modes
    show_header_toggle: false
    entities:
      - entity: select.global_settings_house_mode
        name: House Mode
      - entity: select.global_settings_downstairs_mode
        name: Downstairs Mode
      - entity: select.global_settings_upstairs_mode
        name: Upstairs Mode

  - type: grid
    columns: 2
    square: false
    cards:
      - type: thermostat
        entity: climate.lounge
        name: Lounge
        features:
          - type: climate-preset-modes
            style: dropdown
      - type: thermostat
        entity: climate.master_bedroom
        name: Master Bedroom
        features:
          - type: climate-preset-modes
            style: dropdown

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Conservatory Tuning
        show_header_toggle: false
        entities:
          - entity: select.conservatory_aggressiveness
            name: Aggressiveness
          - entity: number.conservatory_comfort_zone
            name: Comfort Zone
          - entity: number.conservatory_away_lower_limit
            name: Away Lower Limit
          - entity: number.conservatory_away_upper_limit
            name: Away Upper Limit
      - type: entities
        title: Conservatory Diagnostics
        show_header_toggle: false
        entities:
          - type: attribute
            entity: climate.conservatory
            attribute: active_devices
            name: Active Devices
          - entity: binary_sensor.conservatory_radiator_5_degc
          - entity: binary_sensor.conservatory_aircon_fan_0_degc
          - entity: binary_sensor.conservatory_aircon_cool_3_degc
          - entity: binary_sensor.conservatory_aircon_dry_65
