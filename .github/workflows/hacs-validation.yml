name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned to an immutable commit rather than @main: an unpinned reference
      # silently changed validation rules under us once already. Not pinned to
      # the 22.5.0 tag either — that is from 2022 and predates current HACS
      # requirements. Bump this SHA deliberately when revalidating.
      - name: Validate with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-08
        with:
          category: integration
